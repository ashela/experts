# Push protection and secret scanning skip the hosted chat page build.
#
# The gh-pages branch of this repository receives the BUILT hosted chat page
# from ashela/huntaway (dist/, pushed by a deploy key). Its assets/ folder is
# bundled third-party library code. On 2026-09-06 push protection blocked the
# first publish on a "Mistral AI API Key": the match was the class name
# Mistral3ForConditionalGeneration in @huggingface/transformers model table,
# a 32-character identifier that follows the word mistral. Not a secret.
#
# The bypass URL cannot be used for a deploy-key push (it is bound to the
# pushing USER, and a deploy key has none), so this is the documented route:
# https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
#
# Scope is deliberately the built assets only. Expert bundles under experts/
# stay fully scanned.
paths-ignore:
  - "assets/**"
